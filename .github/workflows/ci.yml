name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ada
      GCP_PROJECT: ci-project
      PAYSTACK_SECRET_KEY: sk_test_ci
      PAYSTACK_PUBLIC_KEY: pk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: protected paths (PRs only)
        if: github.event_name == 'pull_request'
        run: ./scripts/check-protected.sh "origin/${{ github.base_ref }}"
      - run: ./scripts/check-cheats.sh
      - run: ruff check src tests features migrations
      - run: mypy src
      - run: alembic upgrade head
      - name: coverage gate
        run: |
          source quality/thresholds.env
          pytest tests -q --cov=ada --cov-report=term --cov-fail-under=$MIN_COVERAGE
      - run: pytest features -q -p no:cacheprovider
      - run: lint-imports
      - run: bandit -q -r src
      - name: mutation gate
        run: |
          source quality/thresholds.env
          MIN_MUTATION_SCORE=$MIN_MUTATION_SCORE python scripts/mutation_score.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
